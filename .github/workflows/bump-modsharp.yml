name: Bump ModSharp

on:
  schedule:
    - cron: '0 15 * * *'  # 00:00 JST
  workflow_dispatch:

jobs:
  bump-shared:
    uses: possession-community/modsharp-publish-action/.github/workflows/bump-nuget.yml@v1
    permissions:
      contents: write
      pull-requests: write
    with:
      package-id: ModSharp.Sharp.Shared
      csproj-paths: |
        TnmsAdminUtils/TnmsAdminUtils.csproj
      pr-labels: dependencies

  bump-foundation:
    uses: possession-community/modsharp-publish-action/.github/workflows/bump-nuget.yml@v1
    permissions:
      contents: write
      pull-requests: write
    with:
      package-id: TnmsPluginFoundation
      csproj-paths: |
        TnmsAdminUtils/TnmsAdminUtils.csproj
      pr-labels: dependencies
